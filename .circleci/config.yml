version: 2.1

executors:
  php-executor:
    docker:
      - image: cimg/php:8.2
    resource_class: medium

jobs:
  test:
    docker:
      - image: cimg/php:8.2
      - image: cimg/postgres:17.0
        environment:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
      - run:
          name: Install Dependencies
          command: |
            composer install --no-progress --prefer-dist --no-interaction --no-scripts --no-suggest
      - save_cache:
          paths:
            - vendor
          key: composer-v1-{{ checksum "composer.lock" }}
      - run:
          name: Set Up Environment Variables
          command: |
            cp .env.example .env
            php artisan key:generate
            php artisan jwt:secret
            echo "DB_CONNECTION=pgsql" >> .env
            echo "DB_HOST=127.0.0.1" >> .env
            echo "DB_PORT=5432" >> .env
            echo "DB_DATABASE=test_db" >> .env
            echo "DB_USERNAME=test_user" >> .env
            echo "DB_PASSWORD=test_pass" >> .env
      - run:
          name: Run Database Migrations
          command: php artisan migrate --force
      - run:
          name: Run Laravel Tests
          command: php artisan test

  deploy:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:zvuo567ZQyOTTi0BDMRoal+EAjVFaY3OTvTptn1QNGA"
      - run:
          name: Deploy Laravel App
          command: |
            ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_SERVER "bash -c '
              echo \"Starting Laravel deployment...\";
              sudo systemctl daemon-reload;
              sudo systemctl restart laravel-deploy.service;
              echo \"Deployment process completed!\";
            '"

  deploy_prod:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:zvuo567ZQyOTTi0BDMRoal+EAjVFaY3OTvTptn1QNGA"
      - run:
          name: Deploy Laravel App to production
          command: |
            ssh -o StrictHostKeyChecking=no $SSH_USERNAME@$SSH_SERVER "bash -c '
              echo \"Starting Laravel deployment to production...\";
              cd /var/www/html/Reconcile-AI-BE-main
              git pull origin main 
              composer install --no-interaction --prefer-dist --no-dev
              php artisan jwt:secret 
              php artisan optimize:clear 
              php artisan migrate --force
              sudo systemctl restart nginx
              echo \"Deployment process completed to production!\";
            '"

workflows:
  version: 2
  test_and_deploy:
    jobs:
      - test:
          filters:
            branches:
              only:
                - dev
                - main
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: dev
      - deploy_prod:
          requires:
            - test
          filters:
            branches:
              only: main