version: '3.8'

services:
  reconxi-be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reconxi-be
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh

    networks:
      - reconxi
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    ports:
      - "8000:80"
      - "8080:8080"  # Reverb WebSocket port

  db:
    image: ankane/pgvector
    container_name: reconxi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconxi
      POSTGRES_USER: reconxi
      POSTGRES_PASSWORD: reconxi
      POSTGRES_ROOT_PASSWORD: 1ncrease
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - reconxi

  redis:
    image: redis:7-alpine
    container_name: reconxi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - reconxi
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:

# networks:
#   reconxi:
#     driver: bridge

networks:
  reconxi:
    name: reconxi