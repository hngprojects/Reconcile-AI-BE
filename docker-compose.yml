services:
  reconxi-be:
    image: ghcr.io/hngprojects/reconcile-ai-be:main
    container_name: reconxi-be
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
      - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf
    networks:
      - reconxi
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:80"
      - "8080:8080"  # Reverb WebSocket port

  db:
    image: pgvector/pgvector:pg17
    container_name: reconxi_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - reconxi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reconxi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - reconxi
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:

# networks:
#   reconxi:
#     driver: bridge

networks:
  reconxi:
    name: reconxi
