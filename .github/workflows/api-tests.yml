
name: CI/CD For Test Automation

on:
  push:
    branches: log/counter
  pull_request:
    branches: q1-test

jobs:
  api-tests:
    runs-on: reconcile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Newman and Newman Reporter HTML
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER }} << 'EOF'
          
          # Navigate to project directory
          cd /var/www/html/QA
          git fetch origin
          git reset --hard HEAD
          git checkout qa-test
          git reset --hard origin/qa-test
          git pull --rebase --no-edit

          #remove old generated files 
          rm -rf public/newman
      

          # Create a timestamp for the log
          echo "API Test Execution - $(date)" > ./newman/logs/api_logs.txt
          echo "=================================================" >> ./newman/logs/api_logs.txt
                  
          # Parse JSON report to create the numbered log file
          node -e '
            const fs = require("fs");
            let lineNum = 1; // initialize a line counter
            try {
              const jsonReport = JSON.parse(fs.readFileSync("./newman/reports/jsonreport.json", "utf8"));
              const logStream = fs.createWriteStream("./newman/logs/api_logs.txt", {flags: "a"});
                  
              // Write overall summary with numbering
              logStream.write(`${lineNum++}. Collection: ${jsonReport.collection.info.name}\n`);
              logStream.write(`${lineNum++}. Total Requests: ${jsonReport.run.stats.requests.total}\n`);
              logStream.write(`${lineNum++}. Total Tests: ${jsonReport.run.stats.assertions.total}\n`);
              logStream.write(`${lineNum++}. Passed Tests: ${jsonReport.run.stats.assertions.total - jsonReport.run.stats.assertions.failed}\n`);
              logStream.write(`${lineNum++}. Failed Tests: ${jsonReport.run.stats.assertions.failed}\n\n`);
                  
              logStream.write(`${lineNum++}. DETAILED TEST RESULTS\n`);
              logStream.write(`${lineNum++}. ====================\n\n`);
                  
              let reqCount = 1;
              jsonReport.run.executions.forEach((execution) => {
                logStream.write(`${lineNum++}. [REQUEST ${reqCount}] ${execution.item.name}\n`);
                  
                if (execution.assertions && execution.assertions.length > 0) {
                  let assertionCount = 1;
                  execution.assertions.forEach((assertion) => {
                    const status = assertion.error ? "❌ FAILED" : "✅ PASSED";
                    logStream.write(`    ${lineNum++}. (${assertionCount}) ${status} - ${assertion.assertion}\n`);
                    if (assertion.error) {
                      logStream.write(`         ${lineNum++}. Error: ${assertion.error.message}\n`);
                      if (assertion.error.expected) {
                        logStream.write(`         ${lineNum++}. Expected: ${assertion.error.expected}\n`);
                      }
                      if (assertion.error.actual) {
                        logStream.write(`         ${lineNum++}. Actual: ${assertion.error.actual}\n`);
                      }
                    }
                    assertionCount++;
                  });
                } else {
                  logStream.write(`    ${lineNum++}. ⚠️ NO TESTS for this request\n`);
                }
                logStream.write("\n");
                reqCount++;
              });
              logStream.write(`${lineNum++}. END OF TEST LOG\n`);
              logStream.end();
              console.log("Log file created successfully");
            } catch (error) {
              console.error("Error processing JSON report:", error);
              fs.appendFileSync("./newman/logs/api_logs.txt",
                `\n${lineNum++}. ERROR: Failed to process JSON report. Newman execution may have failed.\n` +
                `Error details: ${error.message}\n` +
                `${lineNum++}. END OF TEST LOG\n`
              );
            }
          '
      

          # First check if Newman ran successfully by examining reports directory
          echo "Checking for report files..."
          ls -la ./public/newman/reports/ || echo "Reports directory is empty or doesn't exist"
          
          # Then check specifically for the JUnit report
          if [ -f "./public/newman/reports/junitreport.xml" ]; then
            echo "Test execution completed. JUnit report found."
            cat ./public/newman/logs/api_logs.txt || echo "Log file not found"
          else
            echo "Test execution failed. JUnit report not found."
            cat ./public/newman/logs/api_logs.txt || echo "Log file not found"
            exit 1
          fi
      
