name: Testing

on:
  pull_request:
    branches: [main, dev] # Runs for same-repo PRs

jobs:
  test:
    runs-on: reconcile # Self-hosted runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, pdo, bcmath, pgsql, pdo_pgsql, zip, apcu

      - name: Install PostgreSQL Client
        run: |
          sudo apt update && sudo apt install -y postgresql-client

      - name: Create Database and User
        run: |
          sudo -u postgres psql -c "CREATE DATABASE test_db;"
          sudo -u postgres psql -c "CREATE USER test_user WITH PASSWORD 'test_pass';"
          sudo -u postgres psql -c "ALTER ROLE test_user SET client_encoding TO 'utf8';"
          sudo -u postgres psql -c "ALTER ROLE test_user SET default_transaction_isolation TO 'read committed';"
          sudo -u postgres psql -c "ALTER ROLE test_user SET timezone TO 'UTC';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE test_db TO test_user;"

      - name: Install Laravel dependencies
        run: |
          composer install --no-progress --prefer-dist --no-interaction

      - name: Set environment variables for CI
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=test_db" >> .env
          echo "DB_USERNAME=test_user" >> .env
          echo "DB_PASSWORD=test_pass" >> .env

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test
