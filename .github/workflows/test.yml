name: Testing

on:
  push:
    branches:
      - dev
  pull_request:
    branches: [dev]
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          make install
          make setup
      # When database is ready
      # - name: Run migrations
      #   run: php artisan migrate --force

      - name: Run tests
        run: make test
