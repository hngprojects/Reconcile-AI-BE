          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_SERVER }} << 'EOF'
          
          # Navigate to project directory
          cd /var/www/html/runner-be

          # Fetch all branches from remote
          git fetch --all

          # Store the branch name
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"

          # Debug: Print the detected branch
          echo "Detected branch: $BRANCH_NAME"

          # Ensure the branch exists remotely before checking out
          if git show-ref --verify --quiet refs/remotes/origin/$BRANCH_NAME; then
              # If branch exists locally, switch to it
              if git show-ref --verify --quiet refs/heads/$BRANCH_NAME; then
                  git checkout $BRANCH_NAME
              else
                  git checkout -b $BRANCH_NAME origin/$BRANCH_NAME
              fi

              # Reset and pull latest changes
              git reset --hard origin/$BRANCH_NAME
              git pull origin $BRANCH_NAME
          else
              echo "❌ ERROR: Branch '$BRANCH_NAME' not found on remote. Exiting."
              exit 1
          fi

          # Install dependencies
          composer install --no-progress --prefer-dist --no-interaction

          # Set environment variables

