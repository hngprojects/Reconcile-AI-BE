name: Testing

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize]

jobs:
  test:
    runs-on: reconcile  # Self-hosted runner
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check if PostgreSQL is installed
        run: |
          if ! command -v psql &> /dev/null; then
            echo "PostgreSQL is NOT installed on reconcile!"
            exit 1
          else
            echo "PostgreSQL is installed."
          fi

      - name: Ensure PostgreSQL service is running
        run: |
          sudo systemctl start postgresql
          sudo systemctl enable postgresql
          sudo systemctl status postgresql --no-pager

      - name: Create Database & User (if not exists)
        run: |
          sudo -u postgres psql -c "SELECT 'Database exists' FROM pg_database WHERE datname = 'test_db';" || sudo -u postgres psql -c "CREATE DATABASE test_db;"
          sudo -u postgres psql -c "SELECT 'User exists' FROM pg_roles WHERE rolname = 'test_user';" || sudo -u postgres psql -c "CREATE USER test_user WITH PASSWORD 'test_pass';"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE test_db TO test_user;"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, pdo, bcmath, pgsql, pdo_pgsql, zip, apcu

      - name: Install Laravel dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Set environment variables for CI
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=test_db" >> .env
          echo "DB_USERNAME=test_user" >> .env
          echo "DB_PASSWORD=test_pass" >> .env

      - name: Run Database Migrations
        run: php artisan migrate --force

      - name: Run Laravel tests
        run: php artisan test
