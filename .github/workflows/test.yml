name: Testing

on:
  push:
    branches:
      - dev
  pull_request:
    branches: [dev]
    types: [opened, synchronize]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: make install

      - name: Run tests
        run: make test
