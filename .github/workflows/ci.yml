name: Deploy Pipeline

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: ankane/pgvector:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, pdo_pgsql, redis
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup environment
        run: |
          cat > .env << EOF
          APP_NAME=ReconXi
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_TIMEZONE=UTC
          APP_URL=http://localhost
          
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=test_db
          DB_USERNAME=test_user
          DB_PASSWORD=test_pass
          
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=null
          
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          BROADCAST_CONNECTION=log
          
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          
          JWT_SECRET=
          
          GOOGLE_CLIENT_ID=test_client_id
          GOOGLE_CLIENT_SECRET=test_client_secret
          GOOGLE_REDIRECT_URI=http://localhost/api/v1/auth/google/callback
          EOF
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Run database migrations
        run: php artisan migrate:fresh --force

      - name: Run tests
        run: php artisan test --stop-on-failure

      - name: Generate API documentation
        run: php artisan l5-swagger:generate



  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && contains(fromJson('["main", "dev", "staging"]'), github.ref_name)
    timeout-minutes: 10

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            
            BRANCH="${{ github.ref_name }}"
            echo "🚀 Deploying branch: $BRANCH"
            
            # Navigate to deployment directory
            case "$BRANCH" in
              "main")
                cd /home/reconcile/main
                ;;
              "staging")
                cd /home/reconcile/staging
                ;;
              "dev")
                cd /home/reconcile/dev
                ;;
              *)
                echo "❌ Unknown branch: $BRANCH"
                exit 1
                ;;
            esac
            
            # Pull latest code
            git pull origin $BRANCH
            
            # Build and deploy
            make restart
            
            # Health check
            sleep 15
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Deployment successful - Health check passed"
            else
              echo "❌ Deployment failed - Health check failed"
              exit 1
            fi