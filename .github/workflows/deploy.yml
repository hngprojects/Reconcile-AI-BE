name: Deployment
on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  deployment:
    runs-on: reconcile
    timeout-minutes: 10
    steps:
      # - uses: actions/checkout@v4
      - name: Deploy to the server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          # port: 22
          script: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "Starting Laravel deployment for production..."
              cd /var/www/html/Reconcile-AI-BE-main
              git pull origin main
              composer install --no-interaction --prefer-dist --no-dev
              php artisan jwt:secret
              php artisan optimize:clear
              php artisan migrate --force
              # sudo systemctl restart nginx
            elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
              echo "Starting Laravel deployment for development..."
              cd /var/www/html/Reconcile-AI-BE-staging
              git pull origin staging
              composer install --no-interaction --prefer-dist
              php artisan optimize:clear
              php artisan migrate --force
              # Restart the staging service
              # sudo systemctl restart nginx
            else
              echo "Starting Laravel deployment..."
              echo "Starting Laravel deployment for development..."
              cd /var/www/html/Reconcile-AI-BE-dev
              git pull origin dev
              composer install --no-interaction --prefer-dist
              php artisan optimize:clear
              php artisan migrate --force
            fi
