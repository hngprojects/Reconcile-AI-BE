name: Deployment
on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Deploy inside Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: GITHUB_REF_NAME
          script: |
            BRANCH="${GITHUB_REF_NAME}"
            echo "Detected branch: $BRANCH"

            if [[ "$BRANCH" == "main" ]]; then
              echo "🚀 Updating PRODUCTION..."
              docker exec -i reconxi-be bash -c "
                cd /var/www/html &&
                git pull &&
                php artisan migrate --force &&
                php artisan optimize:clear
              "
              echo "✅ Production deployment complete."

            elif [[ "$BRANCH" == "staging" ]]; then
              echo "🚀 Updating STAGING..."
              docker exec -i reconxi-be-staging bash -c "
                cd /var/www/html &&
                git pull &&
                php artisan migrate --force &&
                php artisan optimize:clear
              "
              echo "✅ Staging deployment complete."

            elif [[ "$BRANCH" == "dev" ]]; then
              echo "🚀 Updating DEV..."
              docker exec -i reconxi-be-dev bash -c "
                cd /var/www/html &&
                git pull &&
                php artisan migrate --force &&
                php artisan optimize:clear
              "
              echo "✅ Dev deployment complete."

            else
              echo "❌ Unknown branch: $BRANCH. Exiting..."
              exit 1
            fi
