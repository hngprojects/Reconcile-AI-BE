name: Deployment
on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  deployment:
    runs-on: reconcile
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Deploy to the server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "🚀 Deploying to PRODUCTION..."
              cd /var/www/html/BE-main
     
              bash /usr/local/bin/main.sh
              echo "✅ Production deployment complete."

            elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
              echo "🚀 Deploying to STAGING..."
              cd /var/www/html/staging
              
              echo "🚀 Starting Processor..."
              bash /usr/local/bin/staging_be_processor.sh
              echo "✅ Staging Processor started successfully."

            elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
              echo "🚀 Deploying to STAGING (For-Testing)..."
              cd /var/www/html/staging-new
              
              echo "🚀 Starting New Staging Processor..."

              bash /usr/local/bin/stagingnew_be_processor.sh
              echo "✅ New Staging Processor started successfully."

            else
              echo "❌ Unknown branch: ${{ github.ref }}. Exiting..."
              exit 1
            fi

















