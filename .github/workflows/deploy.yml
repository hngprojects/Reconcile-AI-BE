name: Deployment
on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Deploy inside Docker containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: GITHUB_REF_NAME
          script: |
            BRANCH="${GITHUB_REF_NAME}"
            echo "Detected branch: $BRANCH"

            if [[ "$BRANCH" == "main" ]]; then
              echo "🚀 Updating PRODUCTION..."
              cd /home/reconcile/main &&
              git pull &&
              make restart
              echo "✅ Production deployment complete."

            elif [[ "$BRANCH" == "staging" ]]; then
              echo "🚀 Updating STAGING..."
              cd /home/reconcile/staging &&
              git pull &&
              make restart
              echo "✅ Staging deployment complete."

            elif [[ "$BRANCH" == "dev" ]]; then
              echo "🚀 Updating DEV..."
              cd /home/reconcile/dev &&
              git pull &&
              make restart
              echo "✅ Dev deployment complete."

            else
              echo "❌ Unknown branch: $BRANCH. Exiting..."
              exit 1
            fi
