name: Deployment
on:
  workflow_run:
    workflows: ["Testing"]  # 🚀 This runs ONLY after CI workflow completes
    types:
      - completed  # Runs when CI finishes (success or failure)
  push:
    branches:
      - main
      - dev
jobs:
  deployment:
    runs-on: reconcile
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # ✅ Deploy only if CI passed
    timeout-minutes: 10
    steps:
      # - uses: actions/checkout@v4
      - name: Deploy to the server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          # port: 22
          script: |
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "Starting Laravel deployment for production..."
              cd /var/www/html/Reconcile-AI-BE-main
              git pull origin main
              composer install --no-interaction --prefer-dist --no-dev
              php artisan jwt:secret
              php artisan optimize:clear
              php artisan migrate --force
              sudo systemctl restart nginx
            else
              echo "Starting Laravel deployment..."
              # Start the deployment service (using explicit sudo with NOPASSWD permission)
              cd /var/www/html/Reconcile-AI-BE-dev
              git pull origin dev
              composer install --no-interaction --prefer-dist --no-dev
              php artisan jwt:secret
              php artisan optimize:clear
              php artisan migrate --force
              sudo systemctl restart nginx
            fi

