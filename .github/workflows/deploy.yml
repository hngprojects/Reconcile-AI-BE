name: Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  tag_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Bump version and push tag
        id: versioning
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: auto
          WITH_V: true

  deployment:
    needs: [tag_release]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            # Step 1: Change to the project directory
            cd /var/www/html/Reconcile-AI-BE

            # Step 2: Pull the latest code from the repository
            git pull origin main

            # Step 3: Install dependencies
            composer install --no-interaction --prefer-dist

            # Step 4: Kill the tmux session if it's running
            tmux kill-session -t 1 || true

            # Step 5: Start a new tmux session and run the server
            tmux new-session -d -s 1 'php artisan serve --host=0.0.0.0 --port=8000'

            # Step 6: Attach to tmux session 1 for logs
            tmux attach -t 1
